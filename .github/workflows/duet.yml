name: duet

on:
  push:
    paths:
      - 'crates/**'
      - 'fixtures/**'
      # The golden wire corpus and the packages that consume it. Without these,
      # a change to `corpus/wire-corpus.json` alone would not trigger the run
      # that contains `corpus_matches_the_committed_file` — the one check that
      # says the committed corpus is still what the Rust codec generates. A
      # stale corpus is worse than no corpus: every guest would be conforming to
      # a phantom.
      - 'corpus/**'
      # The hand-written schemas, for the same reason as the corpus: they are
      # the input the committed Dart and TypeScript clients are generated from,
      # and `crates/duet-codegen`'s staleness check is the only thing that says
      # the committed clients are still what those schemas produce. A schema
      # edited alone would otherwise leave two guest packages generated from a
      # file that no longer exists in that form.
      - 'schema/**'
      # The clients `duet generate --check` is run against in the `rust` job.
      # Same reasoning again: edited alone, they would go stale with nothing
      # running the one step that compares them.
      - 'examples/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/duet.yml'
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        run: cargo fmt --all -- --check
      # `duet-core` has NO dependencies, and the whole crate split exists to
      # keep it that way: everything that needs `serde_json`, a thread, or a
      # window lives in a crate above it. That guarantee is the reason a third
      # party can embed the store without inheriting Duet's dependency tree, and
      # it is the kind of property that erodes by accident — one `serde` derive
      # added for convenience and it is gone, with nothing failing.
      #
      # `cargo tree -p duet-core` prints exactly one line when the crate depends
      # on nothing:
      #
      #     duet-core v0.1.0 (/path/to/crates/duet-core)
      #
      # `--edges all` widens this to dev- and build-dependencies too, so a test
      # helper cannot smuggle one in either. Verified against the real command
      # before being relied on here.
      - name: Assert duet-core is dependency-free
        run: |
          set -euo pipefail
          tree="$(cargo tree -p duet-core --all-features --edges all --locked)"
          printf '%s\n' "$tree"
          count="$(printf '%s\n' "$tree" | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::duet-core must depend on nothing; cargo tree printed $count entries"
            exit 1
          fi
          case "$tree" in
            "duet-core v"*) ;;
            *) echo "::error::unexpected cargo tree output: $tree"; exit 1 ;;
          esac
      # The facade's dependency set, pinned.
      #
      # `duet` is what a user depends on, so its tree is the whole cost of
      # adopting Duet. The `duet-core` check above guards the bottom of the
      # stack; this guards the top, and the failure it exists to catch is
      # different in kind. Nothing breaks when a crate is added to `duet` — it
      # compiles, every test passes, and a user quietly inherits a dependency
      # they were never told about. `duet-command` is exactly such a candidate:
      # it is useful, it is ours, and it is deliberately NOT re-exported here,
      # because commands are a host-side concern an embedder opts into.
      #
      # Two sets, because the default and `--all-features` trees answer two
      # different questions:
      #
      # - **default**: four workspace crates and *no third-party crate at all*.
      #   That is the headline property — `duet` with default features links
      #   nothing a user did not ask for.
      # - **--all-features**: adds `duet-derive` and its proc-macro toolchain
      #   (`syn`, `quote`, `proc-macro2`) plus `duet-codegen` and `serde_json`.
      #   Every one of those is compiled for the *build* machine and never
      #   linked into the shipped program, which is the whole reason `derive` is
      #   an opt-in feature.
      #
      # Both are compared as sorted, deduplicated package names — not as tree
      # drawings, which reformat between cargo releases, and not as counts,
      # which a swap of one crate for another would pass.
      - name: Pin the duet facade's dependency set
        run: |
          set -euo pipefail
          packages() {
            cargo tree -p duet --locked --edges normal,build --prefix none \
              --format '{p}' "$@" \
              | awk '{print $1}' | sort -u | tr '\n' ' '
          }
          default="$(packages)"
          expected_default="duet duet-core duet-runtime duet-schema "
          if [ "$default" != "$expected_default" ]; then
            echo "::error::duet's default dependencies changed"
            echo "  expected: $expected_default"
            echo "  actual:   $default"
            exit 1
          fi
          # `commands` pulls in duet-command, and through it duet-protocol and
          # duet-codec: a command's arguments and result travel the same wire
          # as everything else, so the registry needs the envelope types. That
          # is the intended shape of the feature, not drift — and note the
          # DEFAULT set above is unchanged, which is the property that
          # actually protects a user who never opts in.
          full="$(packages --all-features)"
          expected_full="duet duet-codec duet-codegen duet-command duet-core duet-derive duet-protocol duet-runtime duet-schema itoa memchr proc-macro2 quote serde_core serde_json syn unicode-ident zmij "
          if [ "$full" != "$expected_full" ]; then
            echo "::error::duet's --all-features dependencies changed"
            echo "  expected: $expected_full"
            echo "  actual:   $full"
            exit 1
          fi
          printf 'default:      %s\nall-features: %s\n' "$default" "$full"
      # The two platform backends cannot even *compile* on ubuntu-latest.
      # duet-backend-macos links FlutterMacOS.framework and calls into
      # tao/objc2-app-kit; duet-backend-windows links flutter_windows.dll and
      # calls Win32 — this runner has neither toolchain and no window server.
      # Both are excluded from every step below that would try to build them
      # (clippy, docs, coverage, test) rather than silently letting CI stop
      # covering them while looking green. The macOS crate's verification is
      # recorded in crates/duet-backend-macos/FINDINGS.md (real hardware, by
      # hand); the Windows crate gets the `windows` job below — the first
      # platform backend under CI.
      - name: Clippy
        run: cargo clippy --workspace --exclude duet-backend-macos --exclude duet-backend-windows --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --exclude duet-backend-macos --exclude duet-backend-windows --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test with coverage gate
        run: cargo llvm-cov --workspace --exclude duet-backend-macos --exclude duet-backend-windows --locked --fail-under-lines 90
      # Runs duet-protocol's `corpus_matches_the_committed_file`, which
      # regenerates the corpus in memory and compares bytes against the
      # committed file. Both this step and the coverage step above execute it;
      # it is named here so that nobody narrowing the test selection removes the
      # only staleness check without realising what it was.
      # Three staleness checks live in here, and each compares a committed
      # artifact against a fresh regeneration:
      #
      # - `corpus_matches_the_committed_file` in `duet-protocol`, for
      #   `corpus/wire-corpus.json`.
      # - `the_goldens_match_what_the_emitters_produce_now` in `duet-codegen`,
      #   which regenerates every file under `packages/*/test/generated/` from
      #   `schema/*.json`. A stale generated client is worse than none: the two
      #   guest packages would keep compiling and testing against a shape the
      #   host no longer has.
      # - `corpus_matches_the_committed_file` in `duet-codegen`, for
      #   `corpus/schema-corpus.json`. That file states the seed the stdio host
      #   starts from and every path a generated client binds, and BOTH guest
      #   packages read it — the no-host codec checks and the live-host
      #   conformance run alike. A stale one would have every language
      #   conforming to a schema that no longer exists.
      #
      # This step also runs `duet-derive`'s `trybuild` suite, which is the one
      # thing here that a **toolchain bump alone** can break. The `.stderr` files
      # under `crates/duet-derive/tests/ui/` record rustc's rendering of each
      # rejection, not only Duet's own text, so a release that reformats a trait
      # error moves them with nothing being wrong. When that happens:
      #
      #     TRYBUILD=overwrite cargo test -p duet-derive --test compile_fail
      #
      # and read the diff. `every_committed_message_still_names_the_fix` in that
      # file reads the regenerated text with no compiler involved and fails if
      # the guidance naming the fix stopped reaching the user, so a blind
      # regeneration cannot quietly empty the check.
      - name: Test single-threaded (includes all three staleness checks)
        run: cargo test --workspace --exclude duet-backend-macos --exclude duet-backend-windows --locked -- --test-threads=1
      # The fourth staleness check, and the only one a user outside this
      # workspace can reproduce.
      #
      # The other three are `cargo test` assertions. They are the stronger
      # gates — they compare against fixtures, negative corpora and a real host
      # — but they are unavailable to somebody who has `duet` installed and a
      # schema of their own, and they say nothing about whether the CLI can be
      # driven from a shell at all. `crates/duet-cli/tests/cli.rs` covers the
      # binary's behaviour; this covers the invocation, in the exact shape the
      # README tells a newcomer to put in their own CI.
      #
      # It is pointed at `examples/generated/` rather than at the committed
      # goldens under `packages/*/test/generated/`, for a reason worth stating
      # so nobody "fixes" it later: those goldens are generated with the
      # TypeScript import specifiers overridden to reach into
      # `packages/duet-js/src`, because they live inside that package and it
      # cannot import itself by name before a build. Teaching the CLI to
      # reproduce them would mean two more flags on a two-flag tool, serving
      # one in-repo quirk. `examples/generated/` is instead generated with the
      # **defaults** — the published `duet-protocol` specifiers a third party
      # gets — so this step checks the path nothing else here exercises.
      #
      # Exit 3 means stale and exit 1 means broken; `set -e` fails on either,
      # and the tool prints the differing line and the command that fixes it.
      - name: Assert the committed example clients are what duet generates
        run: |
          set -euo pipefail
          cargo run -p duet-cli --locked --quiet -- generate \
            --schema schema/app.json \
            --dart examples/generated/app.duet.dart \
            --ts examples/generated/app.duet.ts \
            --check
      # The showcase's clients, from the showcase's own schema. A separate step
      # from the one above because the two answer different questions: that one
      # gates a hand-written schema, this one gates a schema a Rust definition
      # *produces*. `duet-showcase`'s own test suite already fails if
      # `examples/showcase/schema/showcase.json` stops being what
      # `#[derive(SharedState)]` renders; this is the other half of the chain,
      # and without it the two guests could compile happily against a client
      # generated from a schema nobody has regenerated.
      #
      # The showcase's guests are macOS-only and cannot run here. Its definition
      # and its contract are not, which is exactly what this step checks.
      - name: Assert the committed showcase clients are what duet generates
        run: |
          set -euo pipefail
          cargo run -p duet-cli --locked --quiet -- generate \
            --schema examples/showcase/schema/showcase.json \
            --dart examples/showcase/flutter/lib/src/showcase.duet.dart \
            --ts examples/showcase/web/src/showcase.duet.ts \
            --check

  # The Windows platform backend — the first platform backend under CI, which
  # macOS never got (no macOS runner in this workflow, and the macOS crate's
  # proof has always been examples run by hand on real hardware).
  #
  # What this job can and cannot verify, stated so nobody reads more into a
  # green run than it says. It CAN: compile the crate against the real
  # flutter_windows.dll import surface (`flutter precache --windows` populates
  # the artifact cache that build.rs discovers from the flutter on PATH), hold
  # it to the same clippy/doc bar as the rest of the workspace, run its unit
  # tests (the platform-free handler logic, the size caps, the subscriber
  # filter, and the closed-loop ProxySink test that macOS has to `#[ignore]` —
  # tao on Windows can build an event loop off the main thread), and compile
  # all seven examples. It CANNOT run those examples: they need a real
  # display session, a built Dart guest fixture, and 30-180 seconds of live
  # engine each. Their ALL PASS runs are recorded evidence from real
  # hardware, per docs/10-porting.md §7 — same bar as macOS, now with the
  # compile half automated.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Populate the Flutter Windows engine artifacts
        run: flutter precache --windows
      - name: Build
        run: cargo build -p duet-backend-windows --locked
      - name: Clippy
        run: cargo clippy -p duet-backend-windows --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc -p duet-backend-windows --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo test -p duet-backend-windows --locked -- --test-threads=1
      # duet-dev and duet-cli are platform-free and fully tested on ubuntu —
      # but three real Windows bugs (file:// URI shape, dartaotruntime.exe,
      # drive-letter rootUris) lived in duet-dev precisely because no CI ever
      # ran its tests on Windows. This runner is the only place those paths
      # are exercised; see crates/duet-backend-windows/FINDINGS.md WB4.
      - name: Test the dev tooling on Windows paths
        run: cargo test -p duet-dev -p duet-cli --locked -- --test-threads=1
      - name: Compile the examples
        run: cargo build -p duet-backend-windows --examples --locked

  # The pure-Dart client. This job is the entire reason `packages/duet` and
  # `packages/duet_flutter` are separate packages: `package:flutter/services.dart`
  # cannot be *loaded* under `dart test` — importing it is a compile error, not
  # a lint — so a client that depended on it could only be tested by installing
  # the whole Flutter SDK. Split out, the complete wire format is verified
  # against the golden corpus by the plain Dart SDK in seconds.
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Resolve
        run: dart pub get
        working-directory: packages/duet
      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: packages/duet
      - name: Test
        run: dart test
        working-directory: packages/duet

  # The Flutter binding: a small `DuetTransport` over a `BasicMessageChannel`.
  #
  # Cost versus coverage, since this is the one job here that needs a whole SDK
  # download (~1-2 minutes with the action's cache, against ~15 seconds for the
  # `dart` job above):
  #
  # WITHOUT this job, `packages/duet_flutter` is verified NOWHERE in CI. The
  # three macOS examples that exercise it end to end cannot run here — they need
  # FlutterMacOS.framework and a window server, which is why `duet-backend-macos`
  # is excluded from every Rust step above — so they are a developer's local
  # check, not a gate. That would leave the adapter as the only unguarded seam
  # between the verified wire format and a real Flutter app, and it is exactly
  # the kind of code that breaks silently: a renamed channel constant or a
  # dropped null reply produces a guest that hangs with no error at all.
  #
  # A minute and a half of runner time is a small price for that seam not being
  # a blind spot, so the job is included.
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve
        run: flutter pub get
        working-directory: packages/duet_flutter
      - name: Analyze
        run: flutter analyze
        working-directory: packages/duet_flutter
      - name: Test
        run: flutter test
        working-directory: packages/duet_flutter

  # The TypeScript client. No bundler and no test framework: sources import each
  # other with explicit `.ts` specifiers, so Node's built-in type stripping runs
  # them directly under `node --test`. `npm ci` installs TypeScript and
  # `@types/node`, which are the package's only dependencies of any kind — its
  # runtime dependency count is zero, and the `npm ls --omit=dev` step is what
  # keeps it that way.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/duet-js/package-lock.json
      - name: Install
        run: npm ci
        working-directory: packages/duet-js
      - name: Assert zero runtime dependencies
        run: npm ls --omit=dev --all
        working-directory: packages/duet-js
      - name: Build
        run: npm run build
        working-directory: packages/duet-js
      # Type-checks `src` and `test`, then runs the suite — including the
      # conformance run against `corpus/wire-corpus.json` and the differential
      # run against `BOOTSTRAP_HTML` in `crates/duet-webview/src/bootstrap.rs`,
      # both of which are read from the repository checkout rather than from a
      # copy inside the package.
      - name: Test
        run: npm test
        working-directory: packages/duet-js

  # The generated clients against the REAL host, in the one job that has a Rust
  # toolchain and both guest runtimes at once.
  #
  # # Why this job exists separately from `dart` and `node`
  #
  # `crates/duet-host-stdio` wraps `duet_protocol::handle_text` in a process
  # speaking newline-delimited JSON, so the whole host conversation runs on
  # ubuntu with no window server, no Flutter engine and no webview — which is
  # exactly why `duet-backend-macos` cannot be built here and this can.
  #
  # The `dart` and `node` jobs above have no Rust toolchain, so
  # `packages/duet/test/live_host_test.dart` and
  # `packages/duet-js/test/live-host.test.ts` **skip** there, loudly, naming the
  # build command. That skip is the reason for this job: without it the
  # live-host suites would be skipped everywhere and CI would stay green having
  # run none of them.
  #
  # `DUET_HOST_STDIO` is set explicitly rather than relying on the default
  # `target/debug` lookup. Both suites treat an override that names a missing
  # file as a **failure** rather than a skip, so a broken build path here fails
  # this job instead of silently emptying it.
  #
  # # What it covers that nothing else does
  #
  # Everything that is a property of `duet-core`'s write rules rather than of a
  # value: whether a generated path resolves on a real store, whether a `set` at
  # it is accepted or refused and with exactly which message, whether a
  # subscription pushes the value that was written, and the three measured
  # `Option<Struct>` behaviours. Both guest packages otherwise drive their
  # generated clients against fake hosts transcribed by hand from
  # `crates/duet-core/src/value.rs`, and a transcription can be faithfully
  # wrong — the first run of this job found that it was, in the refusal message
  # a guest sees for a rejected write.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/duet-js/package-lock.json
      - name: Build the stdio host
        run: cargo build -p duet-host-stdio --locked
      - name: Assert the host runs and is seeded from its schema
        # A smoke test before either guest suite, so "the binary is broken"
        # fails here with the host's own diagnostic rather than as a timeout
        # inside a test runner.
        run: |
          set -euo pipefail
          reply="$(printf '%s\n' '{"kind":"get","id":"1","path":"editor.zoom"}' \
            | ./target/debug/duet-host-stdio app)"
          printf '%s\n' "$reply"
          expected='{"id":"1","kind":"value","value":{"t":"f","v":0.0}}'
          if [ "$reply" != "$expected" ]; then
            echo "::error::the stdio host answered $reply, expected $expected"
            exit 1
          fi
      - name: Resolve the Dart package
        run: dart pub get
        working-directory: packages/duet
      - name: Dart against the real host
        run: dart test
        working-directory: packages/duet
        env:
          DUET_HOST_STDIO: ${{ github.workspace }}/target/debug/duet-host-stdio
      - name: Install the TypeScript package
        run: npm ci
        working-directory: packages/duet-js
      - name: TypeScript against the real host
        run: npm test
        working-directory: packages/duet-js
        env:
          DUET_HOST_STDIO: ${{ github.workspace }}/target/debug/duet-host-stdio
