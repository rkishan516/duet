[package]
name = "duet-showcase"
description = "The Duet showcase: one Rust host, a Flutter guest and a webview guest, sharing one store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# `cargo run -p duet-showcase` is the demo. `--bin schema` is the tool that
# writes the contract out; naming a default here keeps the common case short.
default-run = "duet-showcase"

[dependencies]
# The front door, and the only Duet dependency the *definition* needs:
# `#[derive(SharedState)]`, `#[command]`, `install`, `Schema`. Everything in
# `src/state.rs`, `src/commands.rs` and `src/bin/schema.rs` builds from this
# alone, on every platform.
duet = { path = "../../../crates/duet", features = ["derive", "commands"] }

# The surfaces are platform backends, and so is the tour that drives them.
# Declaring them under target predicates rather than plainly is what keeps the
# heavy linkage per-platform: `duet-backend-macos` links
# `FlutterMacOS.framework`, `duet-backend-windows` links `flutter_windows.dll`,
# and `duet-backend-linux` links `libflutter_linux_gtk.so` plus the GTK stack.
# The Linux one *would* compile on a Linux CI runner in principle, but only
# with GTK headers and a Flutter engine artifact cache installed — which is why
# the ubuntu `rust` job excludes this crate and the dedicated `linux` job (the
# one with both) covers it instead. The three backends export the same names
# deliberately (see `crates/duet-backend-windows/src/lib.rs`), which is what
# lets the tour drive any of them through one alias.
[target.'cfg(target_os = "macos")'.dependencies]
duet-backend-macos = { path = "../../../crates/duet-backend-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
duet-backend-windows = { path = "../../../crates/duet-backend-windows" }
# The RSS samples: macOS reads them through `ps`, which Windows does not have —
# the Windows arm asks the OS for its own working-set accounting instead. See
# `src/tour/rss.rs`.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
duet-backend-linux = { path = "../../../crates/duet-backend-linux" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
duet-core = { path = "../../../crates/duet-core" }
duet-host = { path = "../../../crates/duet-host" }
duet-runtime = { path = "../../../crates/duet-runtime" }
duet-supervisor = { path = "../../../crates/duet-supervisor" }
tao = "0.36"
