[workspace]
resolver = "3"
members = [
    "crates/duet",
    "crates/duet-core",
    "crates/duet-runtime",
    "crates/duet-codec",
    "crates/duet-schema",
    "crates/duet-codegen",
    "crates/duet-cli",
    "crates/duet-derive",
    "crates/duet-supervisor",
    "crates/duet-host",
    "crates/duet-backend-macos",
    "crates/duet-protocol",
    "crates/duet-host-stdio",
    "crates/duet-webview",
]
# Phase 0 spikes are throwaway experiments with their own dependencies.
# They must never affect the zero-dependency guarantee of duet-core.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rkishan516/tauri-flutter"
