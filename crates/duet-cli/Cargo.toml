[package]
name = "duet-cli"
description = "The `duet` command: generates typed Dart and TypeScript clients from a Duet schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The binary is `duet`, not `duet-cli`. The package cannot be called `duet`
# because the facade library already is, and a user types the command far more
# often than they type the crate name.
[[bin]]
name = "duet"
path = "src/main.rs"

# TWO dependencies, and both are libraries this tool is a front end for:
# `duet-codegen` is `duet generate`, `duet-dev` is `duet dev`.
#
# Neither brings anything of its own beyond `serde_json`, which `duet-codegen`
# already carried — so adding `duet dev` did not widen this tool's dependency
# tree by a single crate. That was a constraint on `duet-dev`'s design, not a
# happy accident: it hand-rolls its WebSocket client and its file watcher
# precisely so that installing the framework's front door stays cheap. See
# `crates/duet-dev/Cargo.toml` for the full argument.
#
# There is deliberately no argument-parsing crate here. See `args` for the
# reasoning; the short version is that this workspace treats a dependency as a
# cost to be argued for — `duet-core` has none at all, `packages/duet-js` has no
# runtime dependency, and `duet-host-stdio` already hand-rolls its own argv — and
# a two-command tool does not clear that bar.
[dependencies]
duet-codegen = { path = "../duet-codegen" }
duet-dev = { path = "../duet-dev" }
