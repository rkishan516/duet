[package]
name = "duet-command"
description = "A registry of host commands a Duet guest may invoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `duet-protocol` owns the seam — `CommandHost`, `Outcome`, `Args` — because
# `duet_protocol::dispatch_with` has to name it. This crate sits above it and
# provides the ergonomic half: a registry built from closures. The dependency
# cannot point the other way without a cycle.
[dependencies]
duet-core = { path = "../duet-core" }
duet-protocol = { path = "../duet-protocol" }
duet-runtime = { path = "../duet-runtime" }
# `CommandDef` and `SharedState`: the declarative half of this crate describes a
# command to the schema with the same trait the state half is described with, so
# a parameter type Duet refuses is refused by the absence of an impl rather than
# by anything here inspecting it.
duet-schema = { path = "../duet-schema" }

# Only the tests need to look at encoded replies; the library itself never
# touches JSON — `duet-protocol` owns every byte this crate's output becomes.
[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
