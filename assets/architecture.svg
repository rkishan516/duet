<svg width="860" height="470" viewBox="0 0 860 470" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    One host, two guests, one store. Cards carry their own light fills with
    dark text so the diagram reads identically on GitHub's light and dark
    themes; only the connective labels use a mid-gray that works on both.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- the host process -->
  <rect x="180" y="18" width="500" height="170" rx="14" fill="#FDF1EA" stroke="#D34516" stroke-width="2"/>
  <text x="430" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#9A3412">Rust host — one process, owns the state</text>
  <rect x="240" y="66" width="380" height="64" rx="10" fill="#D34516"/>
  <text x="430" y="93" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">the Store</text>
  <text x="430" y="115" text-anchor="middle" font-size="13" fill="#FFE4D6">duet-core · zero dependencies · every write validated here</text>
  <text x="430" y="160" text-anchor="middle" font-size="13" fill="#B3541E">supervisor · lifecycle policies · commands — plus one thin backend crate per OS</text>
  <text x="430" y="178" text-anchor="middle" font-size="12.5" font-style="italic" fill="#B3541E">macOS · Windows · Linux</text>

  <!-- the flutter guest -->
  <rect x="46" y="300" width="330" height="120" rx="14" fill="#E9F6FD" stroke="#3FB6E8" stroke-width="2"/>
  <text x="211" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#0B5D80">Flutter guest</text>
  <text x="211" y="356" text-anchor="middle" font-size="13.5" fill="#24292F">a real Flutter engine, embedded</text>
  <text x="211" y="376" text-anchor="middle" font-size="13.5" fill="#24292F">generated <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">*.duet.dart</tspan> client</text>
  <text x="211" y="400" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57687A">renders · reads · writes · watches</text>

  <!-- the webview guest -->
  <rect x="484" y="300" width="330" height="120" rx="14" fill="#EBF2FA" stroke="#3178C6" stroke-width="2"/>
  <text x="649" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#1E4E8C">Webview guest</text>
  <text x="649" y="356" text-anchor="middle" font-size="13.5" fill="#24292F">a wry webview — WKWebView / WebView2 / WebKitGTK</text>
  <text x="649" y="376" text-anchor="middle" font-size="13.5" fill="#24292F">generated <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">*.duet.ts</tspan> client</text>
  <text x="649" y="400" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57687A">renders · reads · writes · watches</text>

  <!-- flutter <-> store -->
  <path d="M 250 188 C 250 235, 211 250, 211 298" stroke="#8B949E" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="120" y="238" text-anchor="middle" font-size="12.5" fill="#8B949E">duet/rpc — tagged JSON</text>
  <text x="120" y="256" text-anchor="middle" font-size="12.5" fill="#8B949E">over a platform channel</text>

  <!-- webview <-> store -->
  <path d="M 610 188 C 610 235, 649 250, 649 298" stroke="#8B949E" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="742" y="238" text-anchor="middle" font-size="12.5" fill="#8B949E">duet/rpc — tagged JSON</text>
  <text x="742" y="256" text-anchor="middle" font-size="12.5" fill="#8B949E">over wry IPC</text>

  <!-- pushes note, centered between the arrows -->
  <text x="430" y="238" text-anchor="middle" font-size="12.5" fill="#8B949E">every push filtered by subscriber —</text>
  <text x="430" y="256" text-anchor="middle" font-size="12.5" fill="#8B949E">a guest is only ever handed its own state</text>

  <!-- no path between guests -->
  <line x1="386" y1="360" x2="474" y2="360" stroke="#8B949E" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="422" y1="349" x2="438" y2="371" stroke="#C4553A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="438" y1="349" x2="422" y2="371" stroke="#C4553A" stroke-width="2.5" stroke-linecap="round"/>
  <text x="430" y="443" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8B949E">the guests never talk to each other — they see each other's writes through the store</text>
</svg>
