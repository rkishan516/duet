<svg width="560" height="140" viewBox="0 0 560 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The Duet banner, light-background variant. The dark variant differs only
    in the wordmark and tagline colors; the mark itself is color-fast.
  -->
  <!-- the mark, at 100px -->
  <g transform="translate(20 20) scale(0.78125)">
    <rect x="42" y="30" width="8" height="58" rx="4" fill="#3FB6E8"/>
    <rect x="96" y="30" width="8" height="58" rx="4" fill="#3178C6"/>
    <circle cx="35" cy="92" r="15" fill="#3FB6E8"/>
    <circle cx="89" cy="92" r="15" fill="#3178C6"/>
    <rect x="38" y="18" width="70" height="16" rx="8" fill="#D34516"/>
  </g>
  <!-- wordmark -->
  <text x="150" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1F2328">Duet</text>
  <!-- tagline -->
  <text x="153" y="114" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" letter-spacing="0.2" fill="#59636E">two guests, one store</text>
</svg>
