<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The Duet mark: two windows, one store.
    The two rounded windows are the two guests — Flutter blue on the left,
    TypeScript blue on the right — and the Rust-orange dot is the store,
    drawn overlapping into both because it belongs to both worlds and to
    neither guest. Colors are fixed (no currentColor) so the mark reads
    identically on light and dark backgrounds.
  -->
  <!-- left window (Flutter guest) -->
  <rect x="6" y="40" width="50" height="48" rx="11" fill="#3FB6E8"/>
  <!-- right window (webview guest) -->
  <rect x="72" y="40" width="50" height="48" rx="11" fill="#3178C6"/>
  <!-- the store, shared into both -->
  <circle cx="64" cy="64" r="14" fill="#D34516"/>
</svg>
