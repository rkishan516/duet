<svg width="380" height="140" viewBox="0 0 380 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The Duet banner, dark-background variant. Differs from banner-light.svg
    only in the wordmark and tagline colors; the mark itself is color-fast.
    The canvas hugs the artwork for the reason banner-light.svg gives.
  -->
  <!-- the mark, at 100px -->
  <g transform="translate(20 20) scale(0.78125)">
    <rect x="6" y="40" width="50" height="48" rx="11" fill="#3FB6E8"/>
    <rect x="72" y="40" width="50" height="48" rx="11" fill="#3178C6"/>
    <circle cx="64" cy="64" r="14" fill="#D34516"/>
  </g>
  <!-- wordmark -->
  <text x="150" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1.5" fill="#F0F6FC">Duet</text>
  <!-- tagline -->
  <text x="153" y="114" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" letter-spacing="0.2" fill="#9198A1">two guests, one store</text>
</svg>
