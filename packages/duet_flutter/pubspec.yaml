name: duet_flutter
description: >-
  The Flutter binding for the Duet wire protocol: a DuetTransport over the
  duet/rpc BasicMessageChannel, so a Flutter guest can share a Rust host's
  state.
version: 0.1.1
repository: https://github.com/rkishan516/tauri-flutter
issue_tracker: https://github.com/rkishan516/tauri-flutter/issues

environment:
  sdk: ^3.5.0
  flutter: '>=3.10.0'

dependencies:
  duet: '>=0.1.0 <0.3.0'
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
