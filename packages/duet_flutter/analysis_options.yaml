# Static analysis for a published Flutter package.
#
# Deliberately identical to `packages/duet/analysis_options.yaml`. This package
# is the same published surface seen through a Flutter dependency, and a
# binding held to a looser standard than the protocol it binds is exactly how
# an undocumented public member or an implicit `dynamic` gets in.
#
# - `public_member_api_docs`, because this is a published API and an
#   undocumented public member is a defect here, not a style preference.
# - `strict-casts`/`strict-inference`/`strict-raw-types`, because the platform
#   channel hands back `String?` from an untrusted host and an implicit
#   `dynamic` is how that becomes a `TypeError` in a caller's code.
# - `avoid_print`, because a library that writes to stdout has no way to be
#   turned off by the application embedding it.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - public_member_api_docs
    - unawaited_futures
