# Static analysis for a published, pure-Dart package.
#
# Stricter than the default in three deliberate places:
#
# - `public_member_api_docs`, because this is a published API and an
#   undocumented public member is a defect here, not a style preference.
# - `strict-casts`/`strict-inference`/`strict-raw-types`, because this package
#   decodes untrusted JSON: an implicit `dynamic` is exactly how a `TypeError`
#   from `dart:convert` escapes to a caller instead of a diagnosable
#   `DuetCodecException`.
# - `avoid_print`, because a library that writes to stdout has no way to be
#   turned off by the application embedding it.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - public_member_api_docs
    - unawaited_futures
